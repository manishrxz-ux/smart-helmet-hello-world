<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Helmet 2027</title>
    <!-- Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }
        .login-card .card-title {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    
    <div class="card login-card z-depth-3">
        <h4 class="card-title">
            <i class="material-icons blue-text" style="font-size: 36px; vertical-align: middle;">security</i>
            Admin Login
        </h4>
        <form id="loginForm">
            <div class="input-field">
                <i class="material-icons prefix">person</i>
                <input id="username" type="text" required>
                <label for="username">Username</label>
            </div>
            <div class="input-field">
                <i class="material-icons prefix">lock</i>
                <input id="password" type="password" required>
                <label for="password">Password</label>
            </div>
            <p id="errorMsg" class="red-text center-align" style="display: none;">Invalid credentials</p>
            <div class="center-align" style="margin-top: 30px;">
                <button type="submit" class="btn blue darken-2 waves-effect waves-light" style="width: 100%;">
                    LOGIN
                </button>
            </div>
        </form>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        // Check if already logged in
        if (sessionStorage.getItem("isLoggedIn") === "true") {
            window.location.href = "/dashboard.html";
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            if (user === 'admin' && pass === 'admin') {
                sessionStorage.setItem("isLoggedIn", "true");
                window.location.href = "/dashboard.html";
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
