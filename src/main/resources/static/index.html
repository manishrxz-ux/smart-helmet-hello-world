<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Helmet - Material Dashboard</title>
    <!-- Google Fonts: Roboto & Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="grey lighten-4">

    <!-- Top App Bar -->
    <nav class="blue darken-3">
        <div class="nav-wrapper container">
            <a href="#" class="brand-logo"><i class="material-icons left" style="margin-top:2px;">engineering</i>Smart Helmet 2027</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="#"><i class="material-icons left">people</i>Active Workers: <span id="active-count" class="badge white blue-text" style="margin-top: 20px;">0</span></a></li>
                <li><a href="#"><i class="material-icons left">warning</i>Alerts: <span id="alert-count" class="new badge red" data-badge-caption="" style="margin-top: 20px;">0</span></a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container main-content">
        <div class="row">
            <div class="col s12">
                <h4 class="font-weight-light">Real-Time Telemetry</h4>
                <p class="grey-text">Monitoring live sensor data from connected ESP32 helmets (Mock Data Mode).</p>
            </div>
        </div>

        <div class="row" id="workers-grid">
            <!-- Material Cards Injected by JS -->
        </div>
    </div>

    <!-- Floating Action Button for Interaction -->
    <div class="fixed-action-btn">
        <a class="btn-floating btn-large red pulse waves-effect waves-light" onclick="simulateAlert()">
            <i class="large material-icons">add_alert</i>
        </a>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
